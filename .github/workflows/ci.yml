name: CI

on:
  push:
    branches: ["main", "work", "master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm run test

  build-web:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build web SPA
        run: npm run build --workspace web

  dast:
    runs-on: ubuntu-latest
    needs: build-web
    if: github.ref == 'refs/heads/work' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Run ZAP baseline scan (staging)
        env:
          TARGET: ${STAGING_URL}
        run: |
          if [ -z "$TARGET" ]; then
            echo "STAGING_URL not set; skipping ZAP baseline" && exit 0;
          fi
          docker run --rm -v $(pwd):/zap/wrk -t owasp/zap2docker-stable zap-baseline.py -t "$TARGET" -r zap-report.html
      - name: Upload ZAP report
        if: env.TARGET != ''
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-report.html
